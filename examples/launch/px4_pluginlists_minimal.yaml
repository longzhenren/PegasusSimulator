/**:
  ros__parameters:
    # 只开核心插件（支持通配符）
    plugin_allowlist:
      - 'sys_*'            # sys_status, sys_time
      # - 'param'
      - 'command'
      - 'state'
      - 'local_position'
      - 'global_position'  # Mission模式需要GPS坐标，必须启用
      # - 'imu'
      # - 'setpoint_position'
      # - 'setpoint_velocity'
      - 'setpoint_raw'   # 如果你使用 raw setpoint 再打开
      - 'waypoint'       # 用于mission/waypoint服务（trajectory_data_collector需要）
